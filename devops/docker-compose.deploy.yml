# Full-stack deployment: postgres(pgvector) + ollama + backend + frontend.
# Build + run from the repo root (--env-file loads secrets like OPENAI_API_KEY
# from the repo-root .env; the compose project dir would otherwise miss it):
#   docker compose -f devops/docker-compose.deploy.yml --env-file .env up --build -d
# First run only, pull the models the copilot needs (chat + embeddings):
#   docker compose -f devops/docker-compose.deploy.yml exec ollama \
#     sh -c "ollama pull gemma4:e4b && ollama pull nomic-embed-text"
# The copilot runs on the local Ollama model; the draft agent uses OPENAI_API_KEY.

name: coresat

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: coresat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coresat"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # Use the host GPU when present (nvidia runtime); falls back to CPU if the
    # reservation can't be satisfied is NOT automatic — drop this block on a
    # CPU-only host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the coresat_app role + schema (idempotent), then exit.
  migrate:
    build:
      context: ..
      dockerfile: devops/backend.Dockerfile
    command: ["python", "-m", "coresat.db.apply"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/coresat
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: devops/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://coresat_app:coresat_app@postgres:5432/coresat
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/coresat
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      # The copilot runs on the local Ollama model (gemma4:e4b) by default; the
      # draft agent stays on OpenAI. Override either provider via the shell env
      # / .env. Ollama also serves RAG embeddings (nomic-embed-text) + reranker.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-ollama}
      DRAFT_AGENT_PROVIDER: ${DRAFT_AGENT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RUNTIME_LOG_DIR: /app/runtime_log
    volumes:
      # Runtime log (agent SQL, tool errors) lands on the host for debugging.
      # The container runs as a non-root uid, so make the host dir writable by
      # it once (chmod 777 the dir); otherwise the file sink degrades to stdout
      # (docker compose logs backend) and the app still runs.
      - ${HOME}/Projects/etops-demo-data/runtime_log:/app/runtime_log
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: devops/frontend.Dockerfile
      # Next bakes rewrite targets at build time (not runtime env).
      args:
        BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama-models:

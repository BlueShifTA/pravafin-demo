services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coresat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coresat
    ports:
      - "5433:5432"
    volumes:
      - coresat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coresat"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  coresat-pgdata:

[project]
name = "coresat"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for coresat"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi~=0.115",
    "pydantic~=2.10",
    "pydantic-settings~=2.6",
    "uvicorn[standard]~=0.34",
]

[dependency-groups]
dev = [
    "httpx~=0.28",
    "mypy==1.19.1",
    "pre-commit~=3.4",
    "pyright~=1.1",
    "pytest~=8.0",
    "pytest-cov~=5.0",
    "ruff==0.15.7",
]
test = [
    "httpx~=0.28",
    "pytest~=8.0",
    "pytest-cov~=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coresat"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]

[tool.mypy]
strict = true
files = ["coresat"]

[tool.pyright]
include = ["coresat"]

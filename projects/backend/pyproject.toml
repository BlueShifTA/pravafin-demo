[project]
name = "coresat"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for coresat"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi~=0.115",
    "greenlet>=3.5.3",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "pydantic~=2.10",
    "pydantic-settings~=2.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]~=0.34",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncpg-stubs>=0.31.3",
    "httpx~=0.28",
    "mypy==1.19.1",
    "pre-commit~=3.4",
    "pyright~=1.1",
    "pytest~=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov~=5.0",
    "ruff==0.15.7",
]
test = [
    "httpx~=0.28",
    "pytest~=8.0",
    "pytest-cov~=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coresat"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]

[tool.mypy]
strict = true
files = ["coresat"]

[tool.pyright]
include = ["coresat"]

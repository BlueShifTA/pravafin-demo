[project]
name = "project-instruction"
version = "0.1.0"
description = "Project scaffold and instructional documentation for starting new projects"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pre-commit~=3.5",
    "pyright[nodejs]~=1.1",
    "pytest~=8.0",
    "pytest-cov~=5.0",
    "ruff==0.15.7",
]
test = [
    "pytest~=8.0",
    "pytest-cov~=5.0",
]
docs = [
    "sphinx~=7.0",
    "sphinx-rtd-theme~=1.3",
    "sphinx-autodoc-typehints~=1.24",
]


[tool.uv]
default-groups = ["dev", "test", "docs"]

[tool.uv.workspace]
members = ["projects/backend"]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "N",     # pep8-naming
    "RUF",   # ruff-specific rules
    "ASYNC", # async/await best practices
    "TRY",   # exception handling
    "BLE",   # blind exception (bare except)
    "RET",   # return statement consistency
    "LOG",   # logging best practices
    "DTZ",   # datetime timezone awareness
    "T20",   # ban print() in production code
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",  # verbose exception messages (acceptable)
]

[tool.ruff.lint.per-file-ignores]
# Dev tooling scripts: print() is the user interface
"devops/*.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
# Ban parent-relative imports (from ..x). Same-directory relative imports (from .x) are allowed.
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


[tool.pyright]
include = ["projects"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    ".venv",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["projects/backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=projects/backend/coresat",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "--verbose",
]

[tool.coverage.run]
source = ["projects/backend/coresat"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
